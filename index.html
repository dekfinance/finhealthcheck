<style>
/* layout: summary (health band / projection headline) above detail (forms, charts); single scannable column */
:root{
  --bg:#F5F8F9; --card:#FFFFFF; --ink:#15303A; --muted:#5E7681; --line:#E3ECEF;
  --accent:#0E7C86; --accent-deep:#0A5A62; --accent-soft:#E2F1F2;
  --gold:#C58A1A; --gold-soft:#FAF1DD;
  --good:#1A9E6B; --good-soft:#E3F5EC; --warn:#C97F00; --warn-soft:#FBF0DA; --bad:#DB4F3A; --bad-soft:#FBE6E1;
  --display:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  --body:'Noto Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1619; --card:#16232A; --ink:#E7F0F2; --muted:#9FB4BC; --line:#27343A;
  --accent:#2BB5C0; --accent-deep:#1C8D97; --accent-soft:#143037;
  --gold:#E0AC45; --gold-soft:#302612;
  --good:#3FC78A; --good-soft:#123024; --warn:#E6A52E; --warn-soft:#332814; --bad:#F0705A; --bad-soft:#39211C;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1619; --card:#16232A; --ink:#E7F0F2; --muted:#9FB4BC; --line:#27343A;
  --accent:#2BB5C0; --accent-deep:#1C8D97; --accent-soft:#143037;
  --gold:#E0AC45; --gold-soft:#302612;
  --good:#3FC78A; --good-soft:#123024; --warn:#E6A52E; --warn-soft:#332814; --bad:#F0705A; --bad-soft:#39211C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
button{font-family:var(--body);cursor:pointer}
input{font-family:var(--body);accent-color:var(--accent)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const baht = n => "฿" + fmt(n);
const compact = n => { n=Math.round(n||0); const s=n<0?"-":""; n=Math.abs(n);
  return s+(n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+"ล.":n>=1e3?Math.round(n/1e3)+"พ.":fmt(n)); };
const pct = n => (n*100).toFixed(n*100>=100?0:1) + "%";
const x = n => n.toFixed(2) + "×";
const sum = a => a.reduce((s,v)=>s+(+v||0),0);

const DEF = {
  liquid:  ["เงินสดและเงินฝากออมทรัพย์","กองทุนตลาดเงิน / สลากออมทรัพย์","เงินฝากประจำ / สภาพคล่องอื่น"],
  invest:  ["หุ้น / กองทุนหุ้น","กองทุนรวม / ตราสารหนี้","ทองคำ / ลงทุนอื่น ๆ","อสังหาฯ เพื่อปล่อยเช่า"],
  personal:["บ้าน / ที่อยู่อาศัย","รถยนต์","ทรัพย์สินส่วนตัวอื่น ๆ"],
  lshort:  ["หนี้บัตรเครดิต","สินเชื่อส่วนบุคคล","หนี้ระยะสั้นอื่น ๆ (<1 ปี)"],
  llong:   ["สินเชื่อบ้าน","สินเชื่อรถยนต์","หนี้ระยะยาวอื่น ๆ"],

  incasset:["ดอกเบี้ย / เงินปันผล","ค่าเช่ารับ","รายได้จากการลงทุนอื่น"],
  consume: ["ค่าเช่า / ส่วนกลางที่อยู่อาศัย","ค่าอาหารและของใช้","ค่าเดินทาง","ค่าสาธารณูปโภค (น้ำ ไฟ เน็ต)","ค่าใช้จ่ายส่วนตัว / บันเทิง","อื่น ๆ"],
  debt:    ["เงินผ่อนชำระหนี้ (ต่อเดือน)"],
  save:    ["เงินออม (บัญชีออม / ฉุกเฉิน)","เงินลงทุน (กองทุน / หุ้น / RMF / SSF)"],
};
const EXAMPLE = {
  liquid:[150000,50000,0], invest:[300000,50000,0,0], personal:[400000,100000,0],
  lshort:[30000,0,0], llong:[0,350000,0],
  incwork:[45000,8000,0], incasset:[1500,0,0],
  consume:[9000,10000,3000,2500,5000,0], debt:[9000], save:[4000,7000],
};
const EMPTY = Object.fromEntries(Object.entries(DEF).map(([k,a])=>[k,a.map(()=>0)]));

function engine(v){
  const Aliquid=sum(v.liquid), Ainvest=sum(v.invest), Apersonal=sum(v.personal);
  const Lshort=sum(v.lshort), Llong=sum(v.llong);
  const Atot=Aliquid+Ainvest+Apersonal, Ltot=Lshort+Llong, NW=Atot-Ltot;
  const Iwork=sum(v.incwork), Iasset=sum(v.incasset), Itot=Iwork+Iasset;
  const Econs=sum(v.consume), Edebt=sum(v.debt), Esave=sum(v.save);
  const Etot=Econs+Edebt+Esave;
  const ratios = {
    survival: Etot? Itot/Etot : null, liquidity: Etot? Aliquid/Etot : null,
    debtcov: Lshort? Aliquid/Lshort : (Aliquid>=0?Infinity:null),
    debtsvc: Itot? Edebt/Itot : null, savings: Itot? Esave/Itot : null,
    invest: NW>0? Ainvest/NW : null, wealth: Etot? Iasset/Etot : null,
  };
  const inc=Itot*12, cons=Econs*12, dsvc=Edebt*12, sv=Esave*12;
  const surplus=inc-cons-dsvc-sv;
  const dred=Math.min(dsvc,Ltot), excess=dsvc-dred;
  const Lsh1=Math.max(0,Lshort-dsvc), Llo1=Math.max(0,Llong-Math.max(0,dsvc-Lshort));
  const Al1=Aliquid+surplus+excess, Ai1=Ainvest+sv, Ap1=Apersonal;
  const At1=Al1+Ai1+Ap1, Lt1=Lsh1+Llo1, NW1=At1-Lt1;
  return { Aliquid,Ainvest,Apersonal,Lshort,Llong,Atot,Ltot,NW,
    Iwork,Iasset,Itot,Econs,Edebt,Esave,Etot, ratios,
    art:{inc,cons,dsvc,sv,surplus,Al1,Ai1,Ap1,Lsh1,Llo1,At1,Lt1,NW1,dNW:NW1-NW} };
}

function project(v, a){
  const d0=engine(v);
  const yieldRate = (d0.Iasset>0 && d0.Ainvest>0) ? (d0.Iasset*12)/d0.Ainvest : null;
  const rInv=a.rInv/100, gInc=a.gInc/100, infl=a.infl/100, rLiq=a.rLiq/100, rDebt=a.rDebt/100;
  const effYield=Math.min((a.yieldPct||0)/100, rInv);
  let Aliq=d0.Aliquid, Ainv=d0.Ainvest, Apers=d0.Apersonal, Lsh=d0.Lshort, Llo=d0.Llong;
  const iw1=d0.Iwork*12, cons1=d0.Econs*12, debt1=d0.Edebt*12, contr1=d0.Esave*12;
  const rows=[{year:0,Aliq,Ainv,Apers,debt:Lsh+Llo,NW:d0.NW,passive:d0.Iasset*12,expenses:d0.Etot*12,ratios:d0.ratios}];
  let freedom=null;
  for(let t=1;t<=a.years;t++){
    const Lopen=Lsh+Llo;
    const iw=iw1*Math.pow(1+gInc,t-1);
    const ia=(Ainv>0? effYield*Ainv : (d0.Iasset*12)*Math.pow(1+infl,t-1));
    const cons=cons1*Math.pow(1+infl,t-1);
    const contr=contr1*Math.pow(1+gInc,t-1);
    const sched=debt1;
    const interest=rDebt*Lopen;
    let principal=0, freed=0;
    if(sched>=interest){ principal=Math.min(sched-interest,Lopen); freed=sched-interest-principal; }
    else { Llo+=(interest-sched); }
    let p=principal; const sPay=Math.min(p,Lsh); Lsh-=sPay; p-=sPay; Llo=Math.max(0,Llo-p);
    const income=iw+ia, debtCash=sched-freed;
    const surplus=income-cons-debtCash-contr+freed;
    Ainv=Ainv*(1+(rInv-effYield))+contr;
    Aliq=Aliq*(1+rLiq)+surplus;
    const buffer=a.buffer*(cons/12);
    if(Aliq>buffer){ Ainv+=(Aliq-buffer); Aliq=buffer; }
    if(Aliq<0){ Ainv+=Aliq; Aliq=0; }
    const NW=Aliq+Ainv+Apers-(Lsh+Llo);
    const Etot=cons+debtCash+contr;
    const mI=income/12, mE=Etot/12;
    const ratios={ survival:mE?mI/mE:null, liquidity:mE?Aliq/mE:null, debtcov:Lsh?Aliq/Lsh:Infinity,
      debtsvc:mI?(debtCash/12)/mI:null, savings:mI?(contr/12)/mI:null, invest:NW>0?Ainv/NW:null, wealth:mE?(ia/12)/mE:null };
    if(freedom==null && ia>=Etot) freedom=t;
    rows.push({year:t,Aliq,Ainv,Apers,debt:Lsh+Llo,NW,passive:ia,expenses:Etot,ratios});
  }
  return {rows,freedom,yieldRate};
}

  { key:"invest", n:6, name:"อัตราส่วนการลงทุน", formula:"สินทรัพย์ลงทุน ÷ ความมั่งคั่งสุทธิ", bench:"ควร ≥ 50%", unit:"%",

function Chart({series, markers, yfmt, height=180, legend}){
  const W=640,H=height, padL=46,padR=14,padT=12,padB=24;
  const xs=series[0].pts.map(p=>p.x);
  const xmin=Math.min(...xs), xmax=Math.max(...xs);
  let ymax=0; series.forEach(s=>s.pts.forEach(p=>{if(p.y>ymax)ymax=p.y;}));
  ymax=ymax*1.1||1;
  const X=xv=> padL+(xmax===xmin?0:(xv-xmin)/(xmax-xmin))*(W-padL-padR);
  const Y=yv=> H-padB-(yv/ymax)*(H-padT-padB);
  const grid=[0,.25,.5,.75,1].map(f=>f*ymax);
  return <div style={{overflowX:"auto"}}>
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",minWidth:300,display:"block"}} role="img">
      {grid.map((g,i)=>(<g key={i}>
        <line x1={padL} y1={Y(g)} x2={W-padR} y2={Y(g)} stroke="var(--line)" strokeWidth="1"/>
        <text x={padL-6} y={Y(g)+3} textAnchor="end" fontSize="10" fill="var(--muted)" className="num">{yfmt(g)}</text></g>))}
      {xs.map((xv,i)=> (i%Math.ceil(xs.length/8||1)===0||i===xs.length-1)?
        <text key={i} x={X(xv)} y={H-8} textAnchor="middle" fontSize="10" fill="var(--muted)" className="num">{xv}</text>:null)}
      {markers&&markers.map((m,i)=>(<g key={"m"+i}>
        <line x1={X(m.x)} y1={padT} x2={X(m.x)} y2={H-padB} stroke="var(--gold)" strokeWidth="1.5" strokeDasharray="4 3"/>
        <text x={X(m.x)} y={padT+10} textAnchor="middle" fontSize="10" fill="var(--gold)" fontWeight="700">{m.label}</text></g>))}
      {series.map((s,si)=>{
        const d=s.pts.map((p,i)=>(i?"L":"M")+X(p.x)+" "+Y(p.y)).join(" ");
        const area=s.fill?`M${X(s.pts[0].x)} ${Y(0)} `+s.pts.map(p=>"L"+X(p.x)+" "+Y(p.y)).join(" ")+` L${X(s.pts[s.pts.length-1].x)} ${Y(0)} Z`:null;
        return <g key={si}>
          {area&&<path d={area} fill={s.color} opacity="0.12"/>}
          <path d={d} fill="none" stroke={s.color} strokeWidth="2.4" strokeLinejoin="round"/>
          <circle cx={X(s.pts[s.pts.length-1].x)} cy={Y(s.pts[s.pts.length-1].y)} r="3.5" fill={s.color}/>
        </g>;})}
    </svg>
    {legend&&<div style={{display:"flex",gap:14,flexWrap:"wrap",fontSize:11.5,color:"var(--muted)",padding:"2px 4px 0 46px"}}>
      {series.map((s,i)=>(<span key={i} style={{display:"inline-flex",alignItems:"center",gap:5}}>
        <span style={{width:12,height:3,background:s.color,borderRadius:2}}></span>{s.name}</span>))}</div>}
  </div>;
}
function StackChart({rows, keys, height=190, yfmt}){
  const W=640,H=height,padL=46,padR=14,padT=12,padB=24;
  const xs=rows.map(r=>r.year); const xmin=Math.min(...xs),xmax=Math.max(...xs);
  let ymax=0; rows.forEach(r=>{let t=0;keys.forEach(k=>t+=r[k.key]); if(t>ymax)ymax=t;});
  ymax=ymax*1.1||1;
  const X=xv=>padL+(xmax===xmin?0:(xv-xmin)/(xmax-xmin))*(W-padL-padR);
  const Y=yv=>H-padB-(yv/ymax)*(H-padT-padB);
  const grid=[0,.5,1].map(f=>f*ymax);
  let acc=rows.map(()=>0);
  const bands=keys.map(k=>{ const lower=acc.slice();
    const upper=rows.map((r,i)=>acc[i]+r[k.key]); acc=upper;
    const d=`M`+upper.map((u,i)=>X(rows[i].year)+" "+Y(u)).join(" L")+` L`+lower.map((l,i)=>X(rows[rows.length-1-i].year)+" "+Y(lower[rows.length-1-i])).join(" L")+" Z";
    return {d,color:k.color}; });
  return <div style={{overflowX:"auto"}}>
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",minWidth:300,display:"block"}} role="img">
      {grid.map((g,i)=>(<g key={i}><line x1={padL} y1={Y(g)} x2={W-padR} y2={Y(g)} stroke="var(--line)"/>
        <text x={padL-6} y={Y(g)+3} textAnchor="end" fontSize="10" fill="var(--muted)" className="num">{yfmt(g)}</text></g>))}
      {bands.map((b,i)=>(<path key={i} d={b.d} fill={b.color} opacity="0.85"/>))}
      {xs.map((xv,i)=>(i%Math.ceil(xs.length/8||1)===0||i===xs.length-1)?
        <text key={i} x={X(xv)} y={H-8} textAnchor="middle" fontSize="10" fill="var(--muted)" className="num">{xv}</text>:null)}
    </svg>
    <div style={{display:"flex",gap:14,flexWrap:"wrap",fontSize:11.5,color:"var(--muted)",padding:"2px 4px 0 46px"}}>
      {keys.map((k,i)=>(<span key={i} style={{display:"inline-flex",alignItems:"center",gap:5}}>
        <span style={{width:12,height:10,background:k.color,borderRadius:3,opacity:.85}}></span>{k.name}</span>))}</div>
  </div>;
}

      <StackChart yfmt={compact} rows={p.rows} keys={[
        {key:"Aliq",name:"สภาพคล่อง",color:"var(--good)"},
        {key:"Ainv",name:"ลงทุน",color:"var(--accent)"},
        {key:"Apers",name:"ส่วนตัว",color:"var(--muted)"}]} />
      <div style={{paddingTop:6}}>
        <Chart height={120} yfmt={compact} series={[{name:"หนี้สินคงค้าง",color:"var(--bad)",pts:p.rows.map(r=>({x:r.year,y:r.debt}))}]} />
        <div style={{fontSize:11,color:"var(--muted)",paddingLeft:46}}>หนี้สินคงค้าง (ลดลงเมื่อผ่อนชำระ)</div>
      </div>
    </div>

    <h3 style={{fontSize:14,margin:"0 0 8px"}}>อัตราส่วนการเงิน ณ ปีที่ {a.years}</h3>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
      {RATIOS.map(r=><RatioCard key={r.key} r={r} val={last.ratios[r.key]} />)}
    </div>
    <div style={{fontSize:11,color:"var(--muted)"}}>พยากรณ์เป็นการประมาณการเชิงการศึกษาบนสมมติฐานคงที่ ผลจริงขึ้นกับตลาดและพฤติกรรมจริง</div>
  </div>;
}

function CheckView({v,setV,d}){
  const scoreMap={good:1,warn:0.6,bad:0.2,info:0.5};
  let s=0,c=0,goodN=0;
  RATIOS.forEach(r=>{const[lvl]=r.status(d.ratios[r.key]);if(lvl==="na")return;s+=scoreMap[lvl];c++;if(lvl==="good")goodN++;});
  const ps=c?Math.round(s/c*100):0;
  const band=ps>=85?["การเงินแข็งแรงมาก","var(--good)","var(--good-soft)","💪"]:ps>=65?["สุขภาพการเงินดี","var(--good)","var(--good-soft)","🙂"]:ps>=45?["พอใช้ — มีจุดที่ควรปรับปรุง","var(--warn)","var(--warn-soft)","⚠️"]:["ต้องเร่งดูแลการเงิน","var(--bad)","var(--bad-soft)","🚑"];
  return <div>
    <div style={{background:band[2],border:`1px solid ${band[1]}`,borderRadius:16,padding:"16px",marginBottom:8,display:"flex",alignItems:"center",gap:14}}>
      <div style={{fontSize:40,lineHeight:1}}>{band[3]}</div>
      <div style={{flex:1}}><div style={{fontSize:12,color:"var(--muted)",fontWeight:600}}>ผลประเมินสุขภาพการเงิน</div>
        <div style={{fontSize:19,fontWeight:800,color:band[1]}}>{band[0]}</div>
        <div style={{fontSize:12,color:"var(--ink)"}}>ผ่านเกณฑ์ {goodN}/7 ข้อ · คะแนนรวม {ps}/100</div></div>
    </div>
    <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
      <Tile label="ความมั่งคั่งสุทธิ" value={baht(d.NW)} />
      <Tile label="รายได้รวม/เดือน" value={baht(d.Itot)} />
      <Tile label="ค่าใช้จ่ายรวม/เดือน" value={baht(d.Etot)} />
      <Tile label="เงินออม-ลงทุน/เดือน" value={baht(d.Esave)} accent />
    </div>
    {GROUPS.map((g,gi)=>(<div key={gi} style={{marginBottom:14}}>
      <h2 style={{fontSize:13,color:"var(--muted)",fontWeight:700,margin:"0 0 8px 2px"}}><span style={{color:"var(--accent)"}}>{["A","B","C"][gi]}</span> · {g.title}</h2>
      <div style={{display:"grid",gridTemplateColumns:"1fr",gap:8}}>{g.keys.map(k=>{const r=RATIOS.find(r=>r.key===k);return <RatioCard key={k} r={r} val={d.ratios[k]} />;})}</div>
    </div>))}
    <h2 style={{fontSize:15,margin:"22px 0 10px"}}>1 · งบดุล (สินทรัพย์ & หนี้สิน) — ปีที่ 0</h2>
    <div style={{fontSize:12,color:"var(--muted)",marginBottom:10}}>แตะหัวข้อเพื่อกรอกรายการ · ตัวเลขเป็นยอดคงเหลือ ณ วันนี้</div>
    <Section group="liquid" title="สินทรัพย์สภาพคล่อง" subtitle="เงินสด เงินฝาก กองทุนตลาดเงิน" total={d.Aliquid} color="var(--good)" v={v} setV={setV} />
    <Section group="invest" title="สินทรัพย์ลงทุน" subtitle="หุ้น กองทุน ทอง อสังหาฯ ปล่อยเช่า" total={d.Ainvest} color="var(--accent)" v={v} setV={setV} />
    <Section group="personal" title="สินทรัพย์ส่วนตัว" subtitle="บ้านที่อยู่อาศัย รถ ของใช้" total={d.Apersonal} color="var(--muted)" v={v} setV={setV} />
    <Section group="lshort" title="หนี้สินระยะสั้น" subtitle="บัตรเครดิต สินเชื่อบุคคล (<1 ปี)" total={d.Lshort} color="var(--bad)" v={v} setV={setV} />
    <Section group="llong" title="หนี้สินระยะยาว" subtitle="สินเชื่อบ้าน รถยนต์" total={d.Llong} color="var(--warn)" v={v} setV={setV} />
    <h2 style={{fontSize:15,margin:"22px 0 10px"}}>2 · กระแสเงินสด (ต่อเดือน) — ปีที่ 1</h2>
    <Section group="incwork" title="รายได้จากการทำงาน" subtitle="เงินเดือน โบนัส รายได้เสริม" total={d.Iwork} color="var(--good)" v={v} setV={setV} />
    <Section group="incasset" title="รายได้จากสินทรัพย์" subtitle="ดอกเบี้ย ปันผล ค่าเช่า" total={d.Iasset} color="var(--accent)" v={v} setV={setV} />
    <Section group="consume" title="ค่าใช้จ่ายเพื่อการบริโภค" subtitle="ที่อยู่ อาหาร เดินทาง ฯลฯ" total={d.Econs} color="var(--warn)" v={v} setV={setV} />
    <Section group="debt" title="เงินชำระคืนหนี้สิน" subtitle="เงินผ่อนหนี้รวมต่อเดือน" total={d.Edebt} color="var(--bad)" v={v} setV={setV} />
    <Section group="save" title="เงินออมและการลงทุน" subtitle="เงินที่กันไว้ออม/ลงทุนในแต่ละเดือน" total={d.Esave} color="var(--accent)" v={v} setV={setV} />
    <h2 style={{fontSize:15,margin:"8px 0 4px"}}>3 · งบดุลเชื่อมกับกระแสเงินสด: ปีที่ 0 → สิ้นปีที่ 1</h2>
    <div style={{fontSize:12,color:"var(--muted)",marginBottom:12}}>กระแสเงินสดทั้งปี (×12) ไหลกลับเข้างบดุล — เงินออม/ลงทุนเพิ่มสินทรัพย์ลงทุน, เงินผ่อนลดหนี้ (ตัดเงินต้น), เงินเหลือเข้าสภาพคล่อง</div>
    <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:12}}>
      <BSCol title="งบดุล · ปีที่ 0" nw={d.NW} accent="var(--muted)" rows={[["สภาพคล่อง",d.Aliquid],["ลงทุน",d.Ainvest],["ส่วนตัว",d.Apersonal],["• หนี้ระยะสั้น",-d.Lshort],["• หนี้ระยะยาว",-d.Llong]]} />
      <div style={{flex:1,minWidth:150,border:"1px solid var(--line)",borderRadius:12,background:"var(--accent-soft)",padding:"12px"}}>
        <div style={{fontSize:12,fontWeight:700,color:"var(--accent-deep)",marginBottom:8}}>กระแสเงินสดปีที่ 1 (ทั้งปี)</div>
        {[["รายได้รวม",d.art.inc],["− บริโภค",-d.art.cons],["− ผ่อนหนี้ (เงินต้น)",-d.art.dsvc],["− ออม/ลงทุน",-d.art.sv]].map(([l,val],i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0"}}><span>{l}</span><span className="num">{baht(val)}</span></div>))}
        <div style={{borderTop:"1px solid var(--line)",marginTop:8,paddingTop:8,display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:13}}><span>เงินเหลือเข้าสภาพคล่อง</span><span className="num">{baht(d.art.surplus)}</span></div>
      </div>
      <BSCol title="งบดุล · สิ้นปีที่ 1" nw={d.art.NW1} accent="var(--accent)" rows={[["สภาพคล่อง",d.art.Al1],["ลงทุน",d.art.Ai1],["ส่วนตัว",d.art.Ap1],["• หนี้ระยะสั้น",-d.art.Lsh1],["• หนี้ระยะยาว",-d.art.Llo1]]} />
    </div>
    <div style={{background:d.art.dNW>=0?"var(--good-soft)":"var(--bad-soft)",border:`1px solid ${d.art.dNW>=0?"var(--good)":"var(--bad)"}`,borderRadius:12,padding:"12px 14px",fontSize:13.5}}>
      <b style={{color:d.art.dNW>=0?"var(--good)":"var(--bad)"}}>ความมั่งคั่งสุทธิ {d.art.dNW>=0?"เพิ่มขึ้น":"ลดลง"} {baht(Math.abs(d.art.dNW))} ใน 1 ปี</b>
      <div style={{color:"var(--ink)",marginTop:3,fontSize:12.5}}>เท่ากับ “รายได้รวม − ค่าบริโภค” พอดี — เงินออม เงินลงทุน และการผ่อนหนี้ เป็นเพียงการย้ายเงินระหว่างบัญชี ไม่ได้ทำให้ความมั่งคั่งหายไป</div>
    </div>
  </div>;
}

function App(){
  const [v,setV]=useState(EXAMPLE);
  const [mode,setMode]=useState("check");
  const d=useMemo(()=>engine(v),[v]);
  const tab=(id,label)=>(
    <button onClick={()=>setMode(id)} style={{flex:1,textAlign:"center",padding:"9px",borderRadius:10,fontSize:13,fontWeight:700,border:"none",
      background:mode===id?"var(--accent)":"var(--card)",color:mode===id?"#fff":"var(--muted)",
      boxShadow:mode===id?"none":"inset 0 0 0 1px var(--line)"}}>{label}</button>);
  return <div className="wrap">
    <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:14}}>
      <img src={LOGO} alt="DekFinance" style={{height:42}} />
      <div><h1 style={{fontSize:19,color:"var(--accent)",letterSpacing:-0.3}}>มาตรวจสุขภาพการเงินกันเถอะ !!</h1>
        <div style={{fontSize:11.5,color:"var(--muted)"}}>Financial Health Check by เด็กการเงิน</div></div>
    </div>
    <div style={{display:"flex",gap:6,marginBottom:16}}>
      {tab("check","ตรวจสุขภาพ ณ ปัจจุบัน")}
      {tab("project","พยากรณ์หลายปี")}
    </div>
    {mode==="check" ? <CheckView v={v} setV={setV} d={d} /> : <Projection v={v} />}
    {mode==="check" && <div style={{display:"flex",gap:8,margin:"16px 0 0"}}>
      <button onClick={()=>setV(EXAMPLE)} style={{flex:1,padding:"11px",borderRadius:11,fontSize:13.5,fontWeight:700,border:"none",background:"var(--accent)",color:"#fff"}}>ใส่ตัวอย่าง</button>
      <button onClick={()=>setV(EMPTY)} style={{flex:1,padding:"11px",borderRadius:11,fontSize:13.5,fontWeight:700,border:"1px solid var(--line)",background:"transparent",color:"var(--muted)"}}>ล้างค่าทั้งหมด</button>
    </div>}
    <div style={{fontSize:10.5,color:"var(--muted)",textAlign:"center",marginTop:22,lineHeight:1.6}}>
      เครื่องมือให้ความรู้ ไม่ใช่คำแนะนำการลงทุนเฉพาะบุคคล · ไม่เก็บข้อมูลของคุณ (ทุกอย่างอยู่ในเครื่องคุณเท่านั้น)<br/>
      <span style={{color:"var(--accent)",fontWeight:700}}>DekFinance · เด็กการเงิน</span> — อัตราส่วนการเงินส่วนบุคคลตามแนวทาง ตลท.
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
